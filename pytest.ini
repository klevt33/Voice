[pytest]
# Hard per-test time limit.  Requires pytest-timeout (see requirements-dev.txt).
#
# Several modules drive real worker threads (the browser communication loop, the
# audio recorder, the connection monitor).  A test that leaves a thread spinning
# - for example the 300s "wait for submit button" loop in browser.py, which has
# no sleep and no stop-flag check - otherwise blocks the whole run forever with
# no output, which is very hard to diagnose.
#
# Raise this deliberately for a genuinely slow test rather than removing it:
#   pytest --timeout=120 <test>
timeout = 60

# "thread" kills the test by raising in the worker thread, so it also works when
# a test is blocked inside time.sleep() or a queue.get() timeout.
timeout_method = thread

testpaths = tests
python_files = test_*.py

# Note: hardware probe scripts are excluded in tests/conftest.py via
# collect_ignore, which only works from a conftest file, not from this ini.
